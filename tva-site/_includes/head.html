<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="icon" href="assets/logo/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
    <link rel="icon" type="image/svg+xml" href="assets/logo/logo.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Moteur TVA Intracommunautaire">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
    <link rel="stylesheet" href="style.min.css?v={{CSS_HASH}}">
    <script src="script.js?v={{JS_HASH}}" defer></script>
{{EXTRA_HEAD}}
</head>

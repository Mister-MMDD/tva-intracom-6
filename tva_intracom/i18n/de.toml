# MwSt.-Glossar
glossary_title = "MwSt.-Glossar"
glossary_intro = "Die wichtigsten Konzepte, die von der Engine verwendet werden."
glossary_help_tooltip = "MwSt.-Terminologie-Glossar anzeigen"
glossary_footer = "Weitere Details finden Sie in der vollständigen Dokumentation auf unserer Website."

glossary_terms_oss_title = "OSS (One Stop Shop)"
glossary_terms_oss_definition = "Zentrale Anlaufstelle für die MwSt.-Erklärung von grenzüberschreitenden B2C-Verkäufen innerhalb der EU. Ersetzt individuelle MwSt.-Registrierungen in jedem Mitgliedstaat für Fernverkäufe."
glossary_terms_oss_tooltip = "Zentrale MwSt.-Anlaufstelle für grenzüberschreitende B2C-Verkäufe"

glossary_terms_ioss_title = "IOSS"
glossary_terms_ioss_definition = "Zentrale Anlaufstelle für Importe geringen Werts (≤ 150 €) an EU-Verbraucher. Ermöglicht die Erklärung und Zahlung der Import-MwSt. in einem einzigen Mitgliedstaat."
glossary_terms_ioss_tooltip = "Zentrale Anlaufstelle für Importe ≤ 150 €"

glossary_terms_reverse_charge_title = "Reverse Charge (Umkehr der Steuerschuld)"
glossary_terms_reverse_charge_definition = "Mechanismus, bei dem der Käufer die geschuldete MwSt. anstelle des Verkäufers erklärt. Gilt für innergemeinschaftliche B2B-Lieferungen und in einigen Ländern für inländische B2B-Verkäufe (Art. 194)."
glossary_terms_reverse_charge_tooltip = "Käufer erklärt MwSt. anstelle des Verkäufers"

glossary_terms_deemed_supplier_title = "Deemed Supplier"
glossary_terms_deemed_supplier_definition = "Situation, in der der Marktplatz (z. B. Amazon) als MwSt.-Einzieher gilt, der Verkäufer befreit ist. Amazon erhebt und führt MwSt. für grenzüberschreitende B2C-Verkäufe seit Juli 2021 ab."
glossary_terms_deemed_supplier_tooltip = "Marktplatz erhebt MwSt. im Namen des Verkäufers"

glossary_terms_ca3_title = "CA3"
glossary_terms_ca3_definition = "Französisches MwSt.-Erklärungsformular. Die Engine erstellt eine gebrauchsfertige Zusammenfassung mit den Zeilen 08 (Innergemeinschaftliche Erwerbe) und Aufschlüsselungen nach MwSt.-Satz."
glossary_terms_ca3_tooltip = "Französische MwSt.-Erklärung"

glossary_terms_oss_threshold_title = "10.000 €-Schwellenwert (OSS-Schwelle)"
glossary_terms_oss_threshold_definition = "Einheitlicher jährlicher Umsatzschwellenwert für alle grenzüberschreitenden B2C-Verkäufe in der EU. Darunter können Sie den MwSt.-Satz Ihres Heimatlandes anwenden. Darüber ist OSS obligatorisch."
glossary_terms_oss_threshold_tooltip = "Einheitliche 10.000 €-Schwelle für grenzüberschreitende B2C-Verkäufe"

glossary_terms_excluded_territories_title = "Ausgeschlossenes Gebiet (Art. 6-Gebiete)"
glossary_terms_excluded_territories_definition = "Geografische Gebiete, die einem Mitgliedstaat zugeordnet sind, aber vom MwSt.-Gebiet der EU ausgeschlossen sind (z. B. Kanarische Inseln, DOM-TOM, Athos). Ströme in diese Gebiete werden als Exporte behandelt."
glossary_terms_excluded_territories_tooltip = "Gebiete außerhalb des EU-MwSt.-Gebiets (Kanarische Inseln, DOM-TOM...)"

glossary_terms_emebi_intrastat_title = "EMEBI / Intrastat"
glossary_terms_emebi_intrastat_definition = "Monatliche Erhebung über den innergemeinschaftlichen Warenverkehr. Obligatorische statistische Meldung ab bestimmten Schwellenwerten für Versendungen oder Eingänge von Waren."
glossary_terms_emebi_intrastat_tooltip = "Statistische Meldung des innergemeinschaftlichen Warenverkehrs"

glossary_terms_vies_title = "VIES"
glossary_terms_vies_definition = "Europäisches System zum Austausch von MwSt.-Informationen. Ermöglicht die Überprüfung von MwSt.-Nummern für B2B-Befreiungen."
glossary_terms_vies_tooltip = "System zur Validierung innergemeinschaftlicher MwSt.-Nummern"

glossary_terms_nif_title = "NIF (Steueridentifikationsnummer)"
glossary_terms_nif_definition = "Nationale Steueridentifikationsnummer (z. B. Codice Fiscale in Italien, NIF in Spanien). Hinweis: Eine NIF ist nicht unbedingt eine gültige innergemeinschaftliche MwSt.-Nummer für B2B-Befreiungen."
glossary_terms_nif_tooltip = "Nationale Steueridentifikationsnummer"

glossary_terms_eori_title = "EORI (Economic Operator Registration and Identification)"
glossary_terms_eori_definition = "Einheitliche Gemeinschaftsnummer, die für die Erledigung von Zollformalitäten (Import/Export) in Europa erforderlich ist."
glossary_terms_eori_tooltip = "Gemeinschaftsnummer für Zollformalitäten"

glossary_terms_incoterms_title = "Incoterm (DDP / DDU)"
glossary_terms_incoterms_definition = "Handelsbedingungen, die die Verantwortlichkeiten von Verkäufer und Käufer definieren (Gebühren, Zoll, MwSt.). DDP (Delivered Duty Paid): Verkäufer erledigt alles. DDU/DAP: Käufer zahlt Steuern bei Ankunft."
glossary_terms_incoterms_tooltip = "Handelsbedingungen definieren Verkäufer-/Käuferverantwortlichkeiten"

glossary_terms_import_150_title = "150-€-Freigrenze (Einfuhr)"
glossary_terms_import_150_definition = "Schwelle, unterhalb derer bei Einfuhren in die EU keine Zölle erhoben werden. Die Umsatzsteuer bleibt geschuldet und kann über den IOSS oder durch den Beförderer erhoben werden. Oberhalb von 150 € fallen zusätzlich zur Umsatzsteuer Zölle an."
glossary_terms_import_150_tooltip = "Zollfreigrenze für Einfuhren"

glossary_terms_distance_selling_title = "Fernverkauf"
glossary_terms_distance_selling_definition = "Verkauf von Waren, die von einem EU-Land an eine Privatperson in einem anderen EU-Land versandt werden. Diese Verkäufe unterliegen oberhalb der Schwelle von 10.000 € den OSS-Regeln."
glossary_terms_distance_selling_tooltip = "Grenzüberschreitende Verkäufe an Privatpersonen"

glossary_terms_vat_number_title = "USt-IdNr."
glossary_terms_vat_number_definition = "Eindeutige, von der Finanzverwaltung vergebene Kennung. Bei innergemeinschaftlichen Verkäufen muss ihr der Ländercode vorangestellt werden (z. B. FR123456789); sie muss im VIES-System validiert sein, um die B2B-Befreiung zu ermöglichen."
glossary_terms_vat_number_tooltip = "Steuerliche Kennung für die Umsatzsteuer"


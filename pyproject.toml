[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tva-intracom"
version = "0.1.0"
description = "Moteur de calcul de la TVA intracommunautaire pour les ventes marketplace (Amazon)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matthieu" }]
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.9",
    "psycopg2-binary>=2.9",
    "stripe>=11.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "polars>=1.0",
    "pandas>=2.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.0"]
web = [
    "streamlit>=1.30",
    "extra-streamlit-components>=0.1.60",
    "plotly>=5.0",
]

[project.scripts]
tva-intracom = "tva_intracom.cli:main"

[tool.setuptools]
packages = ["tva_intracom"]

[tool.setuptools.package-data]
tva_intracom = ["data/*.csv", "i18n/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
follow_imports = "normal"
ignore_missing_imports = true
strict_optional = false

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "stripe.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "polars.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "extra_streamlit_components.*"
ignore_missing_imports = true

[build]
builder = "RAILPACK"
buildEnvironment = "V3"

[deploy]
runtime = "V2"
numReplicas = 1
startCommand = "sh -c '[ -f /usr/lib/x86_64-linux-gnu/libjemalloc.so.2 ] && export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2; export MALLOC_CONF=\"dirty_decay_ms:0,muzzy_decay_ms:0\"; exec streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false'"
sleepApplication = true
useLegacyStacker = false
ipv6EgressEnabled = true
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1

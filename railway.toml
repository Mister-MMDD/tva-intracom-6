[build]
builder = "RAILPACK"
buildEnvironment = "V3"

[deploy]
runtime = "V2"
numReplicas = 1
startCommand = "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2 streamlit run app.py --server.port=$PORT --server.address=0.0.0.0"
sleepApplication = true
useLegacyStacker = false
ipv6EgressEnabled = true
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
